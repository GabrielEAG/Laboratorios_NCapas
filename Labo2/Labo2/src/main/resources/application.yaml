spring:
  application:
    name: Labo2

  datasource:
    url: jdbc:postgresql://localhost:5432/onepiece_db
    username:
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect